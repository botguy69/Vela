services:
  - type: web
    name: vela
    runtime: docker
    plan: free
    healthCheckPath: /api/cron/tick?src=alive
    envVars:
      - key: VELA_WORKER
        value: "1"
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      # NEVER generateValue — rotating BETTER_AUTH orphans sealed WEEX blobs.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: WEEX_SEAL_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
